name: Build Paperbound

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run desktop
          - os: macos-13
            command: npm run desktop:mac -- --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
      - name: Prefix release assets by platform
        shell: bash
        run: |
          mkdir -p release-staged
          platform="${{ matrix.os }}"
          for file in release/*; do
            if [ -f "$file" ]; then
              cp "$file" "release-staged/${platform}-${file##*/}"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: paperbound-${{ matrix.os }}
          path: release-staged/*

  release:
    if: needs.desktop-build.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    needs: desktop-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
